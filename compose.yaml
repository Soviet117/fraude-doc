name: fraude-doc

services:
  dev:
    build:
      context: .
    image: fraude-doc:dev
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    environment:
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
      UV_CACHE_DIR: /app/.cache/uv
      MLFLOW_TRACKING_URI: file:///app/artifacts/mlruns
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501" # Streamlit
      - "5000:5000" # MLflow
    command: ["sleep", "infinity"]

  gpu:
    extends: dev
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
