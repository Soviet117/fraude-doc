[project]
name = "fraude-doc"
version = "0.1.0"
description = "Prototipo de detección de fraude documental para el CETPRO San Agustín"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Diaz Rios, Rick Neser" },
    { name = "Torres Quispe, Adixon Jair" },
]
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pillow>=11,<13",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pypdfium2>=5,<6",
    "pyyaml>=6.0,<7",
    "reportlab>=4.2,<5",
    "structlog>=24.4,<26",
]

[project.optional-dependencies]
ml = [
    "albumentations>=2.0,<3",
    "imagehash>=4.3,<5",
    "lightgbm>=4.5,<5",
    "mlflow>=2.17,<4",
    "opencv-python-headless>=4.10,<5",
    "python-doctr>=1.1,<2",
    "rapidfuzz>=3.9,<4",
    "reportlab>=4.2,<5",
    "scikit-image>=0.24,<1",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3.1,<6",
    "spacy>=3.8,<4",
    "streamlit>=1.40,<2",
    "timm>=1.0,<2",
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "pre-commit>=4,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraude"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/fraude"]
